<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Snake</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #0d0e15;
    font-family: monospace;
  }
  canvas {
    border: 3px solid #00ffcc;
    box-shadow: 0 0 20px #00ffcc55;
    background: #050508;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scale = 20;
  const rows = canvas.height / scale;
  const columns = canvas.width / scale;

  const directions = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }
  };

  let snake = [{ x: 10, y: 10 }];
  let direction = directions.ArrowRight;
  let food = { x: Math.floor(Math.random() * columns), y: Math.floor(Math.random() * rows) };
  let score = 0;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Snake
    snake.forEach((segment, index) => {
      ctx.fillStyle = index === 0 ? '#00ffcc' : '#00aa88';
      ctx.fillRect(segment.x * scale, segment.y * scale, scale - 1, scale - 1);
    });

    // Draw Food
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(food.x * scale, food.y * scale, scale - 1, scale - 1);

    // Draw Score
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText(`Score: ${score}`, 10, 25);
  }

  function update() {
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (head.x === food.x && head.y === food.y) {
      food = { x: Math.floor(Math.random() * columns), y: Math.floor(Math.random() * rows) };
      score += 10;
    } else {
      snake.pop();
    }

    if (head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) {
      alert(`Game Over! Final Score: ${score}`);
      snake = [{ x: 10, y: 10 }];
      direction = directions.ArrowRight;
      score = 0;
      return;
    }

    snake.unshift(head);
  }

  function gameLoop() {
    update();
    draw();
    setTimeout(gameLoop, 90);
  }

  document.addEventListener('keydown', event => {
    if (directions[event.key]) {
      // Prevent reversing into self
      const newDir = directions[event.key];
      if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
        direction = newDir;
      }
    }
  });

  gameLoop();
</script>
</body>
</html>
