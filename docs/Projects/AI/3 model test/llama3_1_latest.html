<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        /* Styles for the game */
        canvas {
            border: 1px solid black;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
        }
        #high-score {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="score">Score: 0</p>
    <p id="high-score">High Score: 0</p>
    <script>
        // Get the canvas element
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");
        
        // Set the canvas dimensions
        canvas.width = 400;
        canvas.height = 400;
        
        // Define the snake and food variables
        var snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
        var food = {x: Math.floor(Math.random() * 40) * 10, y: Math.floor(Math.random() * 40) * 10};
        
        // Define the movement variables
        var dx = 10;
        var dy = 0;
        
        // Define the score and high score variables
        var score = 0;
        var highScore = 0;
        
        // Define the game loop
        function gameLoop() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw the snake
            for (var i = 0; i < snake.length; i++) {
                ctx.fillStyle = "green";
                ctx.fillRect(snake[i].x, snake[i].y, 10, 10);
            }
            
            // Draw the food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, 10, 10);
            
            // Update the snake position
            for (var i = snake.length - 1; i > 0; i--) {
                snake[i].x = snake[i - 1].x;
                snake[i].y = snake[i - 1].y;
            }
            snake[0].x += dx;
            snake[0].y += dy;
            
            // Check for collision with food
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score++;
                food.x = Math.floor(Math.random() * 40) * 10;
                food.y = Math.floor(Math.random() * 40) * 10;
            }
            
            // Check for collision with wall or itself
            if (snake[0].x < 0 || snake[0].x > canvas.width - 10 || snake[0].y < 0 || snake[0].y > canvas.height - 10 ||
                snake[0].x === snake[1].x && snake[0].y === snake[1].y) {
                highScore = Math.max(highScore, score);
                score = 0;
                food.x = Math.floor(Math.random() * 40) * 10;
                food.y = Math.floor(Math.random() * 40) * 10;
                snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
            }
            
            // Update the score and high score display
            document.getElementById("score").innerHTML = "Score: " + score;
            document.getElementById("high-score").innerHTML = "High Score: " + highScore;
            
            // Call the game loop again
            setTimeout(gameLoop, 100);
        }
        
        // Add event listeners for keyboard input
        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowUp") {
                dx = 0;
                dy = -10;
            } else if (e.key === "ArrowDown") {
                dx = 0;
                dy = 10;
            } else if (e.key === "ArrowLeft") {
                dx = -10;
                dy = 0;
            } else if (e.key === "ArrowRight") {
                dx = 10;
                dy = 0;
            }
        });
        
        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
